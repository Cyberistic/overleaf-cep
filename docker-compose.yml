version: '3.9'

services:
  overleaf:
    build:
      context: ./server-ce
      dockerfile: Dockerfile
    image: overleaf-cep:latest
    container_name: overleaf
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - sharelatex_data:/var/lib/overleaf
      - texlive_data:/usr/local/texlive
    environment:
      # Coolify auto-generated FQDN for the service
      - SERVICE_FQDN_OVERLEAF
      # Use the auto-generated FQDN as site URL
      - OVERLEAF_SITE_URL=${SERVICE_FQDN_OVERLEAF}
      # MongoDB connection (local, no auth needed)
      - OVERLEAF_MONGO_URL=mongodb://mongo/sharelatex
      # Redis connection
      - OVERLEAF_REDIS_HOST=redis
      - REDIS_HOST=redis
      # Overleaf settings
      - OVERLEAF_APP_NAME=Overleaf Community Edition
      - ENABLED_LINKED_FILE_TYPES=project_file,project_output_file
      - ENABLE_CONVERSIONS=true
      - EMAIL_CONFIRMATION_DISABLED=true

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    command: >
      bash -c "
        mongod --replSet overleaf --bind_ip_all &
        sleep 5
        mongosh --eval 'rs.initiate({_id: \"overleaf\", members:[{_id:0, host:\"mongo:27017\"}]})' || true
        wait
      "
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}
      - MONGO_INITDB_DATABASE=sharelatex
      # Coolify will generate a password for the backup user
      - SERVICE_PASSWORD_BACKUP=${SERVICE_PASSWORD_BACKUP}
    healthcheck:
      test: ["CMD", "mongosh", "localhost:27017/test", "--eval", "db.stats().ok"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6.2
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sharelatex_data:
  redis_data:
  mongo_data:
  texlive_data:
